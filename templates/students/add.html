{% extends "base.html" %}
{% block title %}Add Student | InsightScholar{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <div class="breadcrumb">
      <a href="{{ url_for('students.index') }}">Students</a>
      <span>/</span>
      <span>Add</span>
    </div>
    <h1>Add Student</h1>
  </div>
</div>

<div class="content">
  <div class="card" style="max-width:640px">
    <div class="card-header"><h2>Student Information</h2></div>
    <div class="card-body">
      <form method="POST" action="{{ url_for('students.add') }}">
        <div class="form-grid">
          <div class="field">
            <label for="reg_number">Registration Number *</label>
            <input id="reg_number" name="reg_number" type="text" required placeholder="e.g. 2026/001"/>
          </div>
          <div class="form-row">
            <div class="field">
              <label for="first_name">First Name *</label>
              <input id="first_name" name="first_name" type="text" required placeholder="First name"/>
            </div>
            <div class="field">
              <label for="last_name">Last Name *</label>
              <input id="last_name" name="last_name" type="text" required placeholder="Last name"/>
            </div>
          </div>
          <div class="form-row">
            <div class="field">
              <label for="gender">Gender</label>
              <select id="gender" name="gender">
                <option value="">Select…</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="field">
              <label for="date_of_birth">Date of Birth</label>
              <input id="date_of_birth" name="date_of_birth" type="date"/>
            </div>
          </div>
          <div class="field">
            <label for="class_id">Class</label>
            <select id="class_id" name="class_id">
              <option value="">No class assigned</option>
              {% for c in classes %}
              <option value="{{ c.id }}">{{ c.name }}{% if c.grade_level %} ({{ c.grade_level }}){% endif %}</option>
              {% endfor %}
            </select>
            {% if not classes %}
            <span class="hint">No classes yet. <a href="{{ url_for('classes.index') }}">Create one first</a>.</span>
            {% endif %}
          </div>
          <div style="display:flex;gap:10px;padding-top:4px">
            <button type="submit" class="btn btn--primary">Add Student</button>
            <a href="{{ url_for('students.index') }}" class="btn btn--ghost">Cancel</a>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
